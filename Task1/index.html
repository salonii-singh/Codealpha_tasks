<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Image Gallery</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<header>
    <h1><i class="fa-solid fa-image"></i> Modern Image Gallery</h1>
    <p>Responsive Gallery with Filters, Lightbox & Animations</p>

    <button id="themeBtn">
        <i class="fa-solid fa-moon"></i>
    </button>
</header>

<section class="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="nature">Nature</button>
    <button class="filter" data-filter="cars">Cars</button>
    <button class="filter" data-filter="animals">Animals</button>
</section>

<section class="gallery">

<div class="card cars">
<img src="img1.jpg" alt="">
<div class="overlay">
<h3>cars</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card cars">
<img src="img2.jpg" alt="">
<div class="overlay">
<h3>Sports Car</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card cartoon">
<img src="img3.jpg" alt="">
<div class="overlay">
<h3>doraemon</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card cartoon">
<img src="img4.jpg" alt="">
<div class="overlay">
<h3>nobita</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card anime">
<img src="img5.jpg" alt="">
<div class="overlay">
<h3>animation</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card anime">
<img src="img6.jpg" alt="">
<div class="overlay">
<h3>anime</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card nature">
<img src="img7.jpg" alt="">
<div class="overlay">
<h3>Forest</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card cars">
<img src="img8.jpg" alt="">
<div class="overlay">
<h3>Super Car</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card animals">
<img src="img9.jpg" alt="">
<div class="overlay">
<h3>Elephant</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card nature">
<img src="img10.jpg" alt="">
<div class="overlay">
<h3>Waterfall</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card cars">
<img src="img11.jpg" alt="">
<div class="overlay">
<h3>Classic Car</h3>
<button class="view-btn">View</button>
</div>
</div>

<div class="card animals">
<img src="img12.jpg" alt="">
<div class="overlay">
<h3>Panda</h3>
<button class="view-btn">View</button>
</div>
</div>

</section>

<div class="lightbox">

<span class="close">&times;</span>

<button class="prev">
<i class="fa-solid fa-angle-left"></i>
</button>

<img id="lightbox-img">

<button class="next">
<i class="fa-solid fa-angle-right"></i>
</button>

<div class="counter">
<span id="current">1</span> /
<span id="total">12</span>
</div>

</div>

<footer>
<p>© 2026 Modern Image Gallery | Designed with HTML, CSS & JavaScript</p>
</footer>

<script src="script.js"></script>

</body>
</html>
